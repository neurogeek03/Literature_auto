[project]
name = "litauto"
version = "0.1.0"
description = "LitAuto (Literature Automation): Slack -> Obsidian paper pipeline (full text as Markdown, Sonnet key-points node, topic knowledge graph)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "slack-bolt>=1.20",
    "pymupdf4llm>=0.0.17",
    "requests>=2.31",
    "fastembed>=0.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pillow-heif>=0.16",
]

[project.optional-dependencies]
drive = [
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
]
podcast = [
    "mlx-audio>=0.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "kokoro>=0.9; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "misaki[en]>=0.9",
    "imageio-ffmpeg>=0.5",
    "soundfile>=0.12",
    "playwright>=1.45",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.uv]
package = false
