# Copy to config.yaml and adjust. config.yaml is gitignored.

vault:
  path: /ABSOLUTE/PATH/TO/YOUR/obsidian-vault   # create your own Obsidian vault, then put its absolute path here
  notes_subdir: ""          # "" = notes at vault root; or e.g. "papers"
  topics_subdir: topics     # topic hub stubs live here
  images_subdir: images     # poster/slide images embedded in notes live here

# Your themes. Single source of truth for topic stubs, the skill vocabulary the
# model picks from, and the graph colors (one color per top-level theme, shades
# for its sub-themes). Don't hand-craft this — run `python scripts/setup_topics.py`,
# which prompts you for your own themes and fills this in. Re-run anytime to add
# more. The example below is just a placeholder to replace.
# === topics (managed by scripts/setup_topics.py — run that, or edit here + re-run) ===
topics:
  methods:
    - {slug: pipelines, desc: "workflows, tooling, automation"}
    - {slug: models, desc: "modeling and ML methods"}
  reviews: []
# === end topics ===

slack:
  channel_id: ""            # private channel ID (Cxxxxxxxx), filled after app setup

fulltext:
  min_words: 1000           # sufficiency gate: below this -> ask for the full PDF

related:
  model: BAAI/bge-small-en-v1.5
  top_k: 5
  min_similarity: 0.55
  index_path: .cache/vault_index.json

node:
  claude_bin: /opt/homebrew/bin/claude   # absolute path (launchd has a minimal PATH)
  model: claude-sonnet-4-6
  skill: paper-node
  poster_skill: poster-node   # vision variant, used for image (poster/slide) drops
  timeout_seconds: 180

metadata:
  crossref_mailto: you@example.com   # your email — Crossref polite pool
  unpaywall_email: you@example.com   # your email — Unpaywall OA lookup

drive:
  enabled: false
  folder_id: ""             # NotebookLM staging folder (opt-in)

# Conference whitelist for the caption-parsing tag (see IMPROVEMENTS.md #4).
# Add new entries manually; the pipeline never invents a slug that isn't here,
# but it does auto-create the vault sub-topic stub on first use of a known one.
conferences:
  - slug: ISMB_2026
    aliases: ["ISMB 26", "ISMB26", "ISMB 2026", "ISMB-26"]
  - slug: NeurIPS_2025
    aliases: ["NeurIPS 25", "neurips2025", "NeurIPS 2025"]
  - slug: RECOMB_2026
    aliases: ["RECOMB 26", "RECOMB 2026"]
  - slug: CAN_2026
    aliases: ["CAN 26", "CAN26", "CAN 2026", "CAN-26", "CAN-2026"]

paths:
  work_dir: .cache/work     # transient downloaded PDFs
  state_file: state.json    # last-processed Slack timestamp
